name: Docker

on:
    push:
        tags:
            - "v*"
    pull_request:
    workflow_dispatch:

# A new push cancels the previous run of the same ref
concurrency:
    group: docker-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    PLATFORMS: linux/amd64,linux/arm64
    # Docker Hub repository: <username>/<repo>
    # IMAGE: ${{ vars.DOCKERHUB_USERNAME || 'darco2903' }}/spotify-notify

jobs:
    docker:
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - uses: actions/checkout@v5

            # Emulation to build arm64 on the x86 runner
            - uses: docker/setup-qemu-action@v3

            - uses: docker/setup-buildx-action@v3

            - name: Build
              uses: docker/build-push-action@v6
              with:
                  context: .
                  platforms: ${{ env.PLATFORMS }}
                  push: false
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            # Export to Docker Hub
