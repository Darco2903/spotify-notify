name: Publish image

on:
  push:
    tags: ["v*"]

env:
  IMAGE: docker.io/${{ vars.DOCKERHUB_USERNAME }}/spotify-notify

jobs:
  check:
    uses: ./.github/workflows/check.yml
    permissions:
      contents: read

  # Each platform on a native runner (no QEMU), pushed by digest only; merge tags them
  build:
    needs: check
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - platform: amd64
            runner: ubuntu-latest
          - platform: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # labels only, the tags are set by merge
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # Registry cache, not gha: the gha cache is scoped to the ref, so a tag never sees the previous tag's.
          # One per platform, or each build would overwrite the other's
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.platform }}
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.platform }},mode=max

      - env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.platform }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # The multi-platform image, from the two digests of build
  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 1.2.3 / 1.2 / 1 on v1.2.3 tags, sha-<short> on every build
      # latest is added automatically on the newest non-prerelease semver tag
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)

  deploy:
    needs: merge
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Install cloudflared
        run: |
          curl -fsSL -o cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: SSH key and pinned host key
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # From the server: cat /etc/ssh/ssh_host_ed25519_key.pub
          echo "ssh.darco2903.fr ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIL2MKnVHBrf1RLwbGikOq5h1uIw9PJR6opJBRcFm7cQd root@ubuntu20-04" > ~/.ssh/known_hosts

      # The forced command on the server does the deploy, nothing to send
      - name: Deploy
        run: |
          ssh -T -o BatchMode=yes \
            -o ProxyCommand="cloudflared access ssh --hostname %h" \
            deploy@ssh.darco2903.fr
