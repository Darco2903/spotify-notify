name: Check

on:
    # tags are checked by publish.yml before building the image
    push:
        branches: ["**"]
        # skipped only when every changed file matches; workflow_call ignores this
        paths-ignore:
            - "**.md"
            - LICENSE
            - compose.yml
            - Dockerfile
            - .dockerignore
            - .env.example
            - .gitignore
            - .gitattributes
            - .github/workflows/publish.yml
    workflow_call:
    workflow_dispatch:

# a newer push on the same branch cancels the running check
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v7

            # version comes from packageManager in package.json
            - uses: pnpm/action-setup@v6

            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            - run: pnpm check

            - run: pnpm test
