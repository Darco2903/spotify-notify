name: spotify-notify
services:
  spotify-notify:
    build: .
    image: darco2903/spotify-notify:latest
    container_name: spotify-notify
    restart: unless-stopped
    volumes:
      - ./config.json:/app/config.json:ro
      - ./refresh_token.txt:/app/refresh_token.txt:rw
      - cache:/app/cache
volumes:
  cache:
